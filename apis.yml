name: Wollit
description: 'Wollit is a UK-based credit-health subscription service (£9.99/month)
  that helps consumers build and strengthen their credit profile. Authorised and regulated
  by the Financial Conduct Authority for credit-broking activities, Wollit reports
  rent and subscription payments to Experian, Equifax and TransUnion, and bundles
  a suite of consumer tools: Rent Reporting, Payment Reporting, an AI credit assistant
  (Olli), Affordability Boost, Credit Smart lessons, and Credit Wins. It is a consumer-facing
  fintech app and was surfaced as a portfolio company of Anthemis; it publishes no
  public API, developer portal, or SDKs.'
